<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087dac">
  <title>Ficha de Entrevista</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <div>
      <strong>Ficha de Entrevista</strong>
      <span>O preenchimento é salvo automaticamente neste navegador.</span>
    </div>
    <div class="actions">
      <button id="clearButton" type="button" class="secondary">Limpar ficha</button>
      <button id="printButton" type="button">Imprimir / Salvar em PDF</button>
    </div>
  </header>

  <main id="stage" class="stage">
    <form id="interviewForm" class="sheet" autocomplete="off" aria-label="Ficha de entrevista">
      <img src="./ficha-fundo.png" alt="Modelo da ficha de entrevista" class="sheet-background">

      <input class="field" name="nome_aluno" aria-label="Nome do aluno" style="--x:196;--y:258;--w:526">
      <input class="field center" name="nascimento_dia" aria-label="Dia de nascimento" inputmode="numeric" maxlength="2" style="--x:230;--y:282;--w:36">
      <input class="field center" name="nascimento_mes" aria-label="Mês de nascimento" inputmode="numeric" maxlength="2" style="--x:274;--y:282;--w:36">
      <input class="field center" name="nascimento_ano" aria-label="Ano de nascimento" inputmode="numeric" maxlength="4" style="--x:318;--y:282;--w:51">
      <label class="check" style="--x:390;--y:284"><input type="radio" name="sexo" value="F"><span></span><i>Feminino</i></label>
      <label class="check" style="--x:437;--y:284"><input type="radio" name="sexo" value="M"><span></span><i>Masculino</i></label>

      <input class="field" name="agrupamento" aria-label="Agrupamento" style="--x:162;--y:306;--w:126">
      <input class="field" name="turma" aria-label="Turma" style="--x:321;--y:306;--w:206">
      <input class="field" name="endereco" aria-label="Endereço" style="--x:149;--y:330;--w:425">
      <input class="field" name="cep" aria-label="CEP" style="--x:636;--y:330;--w:102">
      <input class="field" name="nome_mae" aria-label="Nome da mãe" style="--x:185;--y:355;--w:550">
      <input class="field" name="nome_pai" aria-label="Nome do pai" style="--x:178;--y:379;--w:558">
      <input class="field" name="responsavel" aria-label="Nome do responsável" style="--x:481;--y:404;--w:255">
      <input class="field" name="contato_mae" aria-label="Contato da mãe" style="--x:198;--y:428;--w:252">
      <input class="field" name="contato_pai" aria-label="Contato do pai" style="--x:564;--y:428;--w:173">
      <input class="field" name="outro_nome" aria-label="Nome de outro contato" style="--x:238;--y:453;--w:228">
      <input class="field" name="outro_contato" aria-label="Número de outro contato" style="--x:508;--y:453;--w:229">
      <input class="field" name="pessoas_familia" aria-label="Quantidade de pessoas na família" style="--x:355;--y:477;--w:382">
      <input class="field" name="relacionamento_familia" aria-label="Relacionamento da criança com a família" style="--x:158;--y:526;--w:579">
      <input class="field" name="relacionamento_criancas" aria-label="Relacionamento com outras crianças" style="--x:529;--y:551;--w:208">

      <label class="check" style="--x:361;--y:574"><input type="radio" name="problema_saude" value="Sim"><span></span><i>Sim</i></label>
      <label class="check" style="--x:414;--y:574"><input type="radio" name="problema_saude" value="Não"><span></span><i>Não</i></label>
      <input class="field" name="qual_saude" aria-label="Qual problema de saúde" style="--x:119;--y:600;--w:622">

      <label class="check" style="--x:355;--y:623"><input type="radio" name="necessidade_especial" value="Sim"><span></span><i>Sim</i></label>
      <label class="check" style="--x:408;--y:623"><input type="radio" name="necessidade_especial" value="Não"><span></span><i>Não</i></label>
      <input class="field" name="qual_necessidade" aria-label="Qual necessidade especial" style="--x:119;--y:650;--w:622">

      <label class="check" style="--x:349;--y:672"><input type="radio" name="restricao_alimentar" value="Sim"><span></span><i>Sim</i></label>
      <label class="check" style="--x:430;--y:672"><input type="radio" name="restricao_alimentar" value="Não"><span></span><i>Não</i></label>
      <input class="field" name="qual_restricao" aria-label="Qual restrição alimentar" style="--x:119;--y:699;--w:622">

      <label class="check" style="--x:378;--y:721"><input type="radio" name="laudo_medico" value="Sim"><span></span><i>Sim</i></label>
      <label class="check" style="--x:460;--y:721"><input type="radio" name="laudo_medico" value="Não"><span></span><i>Não</i></label>
      <label class="check" style="--x:369;--y:770"><input type="radio" name="autoriza_imagem" value="Sim"><span></span><i>Sim</i></label>
      <label class="check" style="--x:450;--y:770"><input type="radio" name="autoriza_imagem" value="Não"><span></span><i>Não</i></label>

      <input class="field" name="autorizado_1" aria-label="Primeira pessoa autorizada" style="--x:127;--y:819;--w:297">
      <input class="field" name="parentesco_1" aria-label="Grau de parentesco da primeira pessoa" style="--x:574;--y:819;--w:163">
      <input class="field" name="autorizado_2" aria-label="Segunda pessoa autorizada" style="--x:127;--y:843;--w:297">
      <input class="field" name="parentesco_2" aria-label="Grau de parentesco da segunda pessoa" style="--x:574;--y:843;--w:163">
      <input class="field" name="autorizado_3" aria-label="Terceira pessoa autorizada" style="--x:127;--y:868;--w:297">
      <input class="field" name="parentesco_3" aria-label="Grau de parentesco da terceira pessoa" style="--x:574;--y:868;--w:163">
      <input class="field" name="observacoes" aria-label="Observações" style="--x:154;--y:892;--w:583">

      <input class="field center" name="data_dia" aria-label="Dia da entrevista" inputmode="numeric" maxlength="2" style="--x:181;--y:965;--w:86">
      <input class="field center" name="data_mes" aria-label="Mês da entrevista" inputmode="numeric" maxlength="2" style="--x:274;--y:965;--w:65">
      <input class="field center" name="data_ano" aria-label="Ano da entrevista" inputmode="numeric" maxlength="4" style="--x:345;--y:965;--w:87">
      <input class="field" name="assinatura" aria-label="Nome do responsável para assinatura" style="--x:277;--y:1007;--w:460">
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
