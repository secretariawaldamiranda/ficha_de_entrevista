const cepField=page.querySelector('[aria-label="CEP"]');
const picker=document.createElement('section');picker.id='cep-picker';picker.hidden=true;picker.setAttribute('aria-label','Selecionar CEP por endereço');
picker.innerHTML='<div class="cep-heading"><strong>Endereços de Formosa</strong><button type="button" aria-label="Fechar lista de CEPs">×</button></div><input id="cep-search" type="search" placeholder="Buscar rua, bairro ou CEP…" aria-label="Buscar rua, bairro ou CEP"><div id="cep-results"></div>';
document.body.append(picker);
const cepSearch=picker.querySelector('#cep-search'),cepResults=picker.querySelector('#cep-results');
cepField.setAttribute('aria-controls','cep-picker');cepField.setAttribute('aria-expanded','false');
function normalizeCep(value){return value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function placeCepPicker(){const r=cepField.getBoundingClientRect();const width=Math.min(360,innerWidth-16);picker.style.width=width+'px';picker.style.left=Math.max(8,Math.min(innerWidth-width-8,r.right-width))+'px';const room=r.top-16;const height=Math.min(310,Math.max(150,room));picker.style.height=height+'px';picker.style.top=Math.max(8,r.top-height-6)+'px'}
function closeCepPicker(){picker.hidden=true;cepField.setAttribute('aria-expanded','false')}
function renderCepAddresses(){const q=normalizeCep(cepSearch.value.trim());const digits=q.replace(/\D/g,'');cepResults.replaceChildren();const matches=cepAddresses.filter(a=>normalizeCep(a.name+' '+a.cep).includes(q)||(digits&&/^[-\d\s]+$/.test(q)&&a.cep.replace(/\D/g,'').includes(digits)));for(const a of matches){const button=document.createElement('button');button.type='button';button.className='cep-option';const name=document.createElement('span'),code=document.createElement('span');name.textContent=a.name;code.textContent=a.cep;button.append(name,code);button.onclick=()=>{cepField.value=a.cep;save();cepField.focus({preventScroll:true});closeCepPicker()};cepResults.append(button)}if(!matches.length){const empty=document.createElement('p');empty.textContent='Nenhum endereço encontrado. Você também pode digitar o CEP direto no campo.';cepResults.append(empty)}}
function openCepPicker(){cepSearch.value='';renderCepAddresses();picker.hidden=false;cepField.setAttribute('aria-expanded','true');placeCepPicker()}
cepField.addEventListener('focus',openCepPicker);cepField.addEventListener('click',()=>{if(picker.hidden)openCepPicker()});cepField.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();if(picker.hidden)openCepPicker();cepSearch.focus()}});
cepSearch.addEventListener('input',renderCepAddresses);cepSearch.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();cepResults.querySelector('button')?.focus()}});
cepResults.addEventListener('keydown',e=>{if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;const buttons=[...cepResults.querySelectorAll('button')],i=buttons.indexOf(document.activeElement);if(i<0)return;e.preventDefault();buttons[(i+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length]?.focus()});
picker.querySelector('.cep-heading button').onclick=()=>{cepField.focus({preventScroll:true});closeCepPicker()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!picker.hidden){cepField.focus({preventScroll:true});closeCepPicker()}});
document.addEventListener('pointerdown',e=>{if(e.target!==cepField&&!picker.contains(e.target))closeCepPicker()});document.addEventListener('focusin',e=>{if(e.target!==cepField&&!picker.contains(e.target))closeCepPicker()});
addEventListener('resize',()=>{if(!picker.hidden)placeCepPicker()});addEventListener('scroll',()=>{if(!picker.hidden)placeCepPicker()},true);
